services:
  keycloak-app:
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    image: quay.io/keycloak/keycloak:26.5.1@sha256:b80a48090594367bd8cf6fe2019466ac4ea49de4d0830fb2a43256eda37b18f5
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${HOSTNAME}
      PROXY_ADDRESS_FORWARDING: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak/themes/dana:/opt/keycloak/themes/dana
      - ./keycloak/init_data/:/opt/keycloak/data/import/:ro
    # use this block for exporting the keycloak configuration
    # entrypoint: ["/bin/sh", "-c"]
    # command: ["sleep infinity"]
    # use this for production setup (needs https)
    command: start --proxy-headers xforwarded --http-relative-path=/auth --metrics-enabled=true --import-realm --health-enabled=true
    networks:
      - cut-dana-network
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/auth/health/live']
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 10s

  keycloak-db:
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak-db
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    environment:
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${KEYCLOAK_DATABASE_USER}", "-h", "127.0.0.1", "-t", "5" ]
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 10s
    volumes:
      - ${PWD}/postgres-keycloak/init_data:/docker-entrypoint-initdb.d
      - postgres_keycloak_data:/var/lib/postgresql
    networks:
      - cut-dana-network

  db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_DB}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DATABASE_USER}", "-h", "127.0.0.1", "-t", "5" ]
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cut-dana-network

  garage:
    container_name: ${COMPOSE_PROJECT_NAME}-garage
    image: dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - garage_data:/data
      - garage_metadata:/metadata
    healthcheck:
      test: [ 'CMD', '/garage', 'status' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cut-dana-network

networks:
  cut-dana-network:

volumes:
  garage_data:
  garage_metadata:
  postgres_data:
  postgres_keycloak_data:
